<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Bếp Nhà Bông</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: white; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        .logo-title { text-align: center; color: #e65100; font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-buttons { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: bold; color: #888; cursor: pointer; }
        .tab-btn.active { color: #ff9800; border-bottom: 3px solid #ff9800; margin-bottom: -2px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #444; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #ff9800; }
        .btn-submit { width: 100%; padding: 12px; background: #ff9800; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #f57c00; }
        .error-alert { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .success-alert { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .forgot-link { display: block; text-align: right; font-size: 12px; color: #ff9800; text-decoration: none; margin-top: 5px; font-weight: 600; }
        .note-text { font-size: 11px; color: #777; margin-top: 3px; }
    </style>
</head>
<body>

<div class="auth-container">
    <a href="/" style="text-decoration: none;" class="logo-title">
        <i class="fa-solid fa-utensils"></i> Bếp Nhà Bông
    </a>

    <div class="tab-buttons">
        <button class="tab-btn active" id="btn-login-tab" onclick="switchTab('login')">Đăng Nhập</button>
        <button class="tab-btn" id="btn-register-tab" onclick="switchTab('register')">Đăng Ký Mới</button>
    </div>

    {% if error %}
        <div class="error-alert"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="success-alert"><i class="fa-solid fa-circle-check"></i> {{ success }}</div>
    {% endif %}

    <form id="login-form" action="/login" method="POST">
        <input type="hidden" name="action" value="login">
        <div class="form-group">
            <label>Tên đăng nhập hoặc Email</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập hoặc email..." required>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu..." required>
            <a href="/forgot-password" class="forgot-link">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập</button>
    </form>

    <form id="register-form" action="/login" method="POST" style="display: none;" onsubmit="return validateRegisterForm()">
        <input type="hidden" name="action" value="register">
        <div class="form-group">
            <label>Tên hiển thị (Tên tác giả)</label>
            <input type="text" name="full_name" placeholder="Ví dụ: Nguyễn Văn A" required minlength="2">
        </div>
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Chỉ gồm chữ cái, số, không dấu..." required pattern="^[a-zA-Z0-9_]+$" title="Tên đăng nhập chỉ chứa chữ cái, số và dấu gạch dưới (_)">
        </div>
        <div class="form-group">
            <label>Địa chỉ Email</label>
            <input type="email" name="email" placeholder="VD: example@gmail.com" required>
            <div class="note-text">Email thật dùng để bảo mật và khôi phục tài khoản khi cần.</div>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="reg_password" name="password" placeholder="Tối thiểu 6 ký tự..." required minlength="6">
        </div>
        <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu..." required minlength="6">
        </div>
        <button type="submit" class="btn-submit" style="background: #28a745;">Tạo Tài Khoản Bảo Mật</button>
    </form>
</div>

<script>
    function switchTab(tab) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const btnLogin = document.getElementById('btn-login-tab');
        const btnRegister = document.getElementById('btn-register-tab');

        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            btnLogin.classList.add('active');
            btnRegister.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            btnRegister.classList.add('active');
            btnLogin.classList.remove('active');
        }
    }

    function validateRegisterForm() {
        const pw = document.getElementById('reg_password').value;
        const confirmPw = document.getElementById('confirm_password').value;

        if (pw !== confirmPw) {
            alert('Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.');
            return false;
        }
        return true;
    }
</script>

</body>
</html>
