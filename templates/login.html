<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Bếp Nhà Bông</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #ff5722; margin-bottom: 20px; font-size: 22px; font-weight: 800; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 12px; font-size: 14px; }
        .btn-google { background: #ea4335; color: white; }
        .btn-facebook { background: #1877f2; color: white; }
        .divider { margin: 20px 0; color: #888; font-size: 13px; position: relative; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { background: #ff5722; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🍳 Đăng Nhập Bếp Nhà Bông</h2>
    
    <a href="/login-social/google" class="social-btn btn-google"><i class="fa-brands fa-google"></i> Đăng nhập bằng Google</a>
    <a href="/login-social/facebook" class="social-btn btn-facebook"><i class="fa-brands fa-facebook"></i> Đăng nhập bằng Facebook</a>

    <div class="divider">HOẶC DÀNH CHO QUẢN TRỊ VIÊN</div>

    {% if error %}
        <div style="color: red; font-size: 13px; margin-bottom: 10px;">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label>Tên đăng nhập Admin</label>
            <input type="text" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu Admin</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Đăng Nhập Admin</button>
    </form>
</div>

</body>
</html>
