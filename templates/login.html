<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bếp Nhà Bông</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; }
        .back-home { display: inline-flex; align-items: center; gap: 6px; color: #666; text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: 500; transition: color 0.2s; }
        .back-home:hover { color: #ff5722; }
        h2 { text-align: center; color: #ff5722; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background: #ff5722; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #e64a19; }
        .auth-footer { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
        .auth-footer a { color: #ff5722; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Nút Quay Lại Trang Chủ -->
        <a href="/" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
        </a>

        <h2>Đăng Nhập</h2>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Tên đăng nhập hoặc Email</label>
                <input type="text" name="username" required placeholder="Nhập tên đăng nhập hoặc email">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
