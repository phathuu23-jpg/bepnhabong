<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang không tồn tại - Bếp Nhà Bông</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .box { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 450px; width: 100%; }
        h1 { font-size: 72px; color: #ff5722; margin-bottom: 10px; }
        h2 { font-size: 20px; color: #333; margin-bottom: 15px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        a { display: inline-block; background: #ff5722; color: white; padding: 10px 24px; border-radius: 20px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h1>404</h1>
        <h2>Không Tìm Thấy Trang</h2>
        <p>Đường dẫn bạn truy cập có thể đã bị xóa hoặc không tồn tại trên Bếp Nhà Bông.</p>
        <a href="/">Trở về trang chủ</a>
    </div>

</body>
</html>
