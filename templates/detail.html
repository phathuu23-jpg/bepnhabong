<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ food.name }} - Bếp Nhà Bông</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #555;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #ff5722; }

        .logo { text-decoration: none; color: #e65100; font-weight: bold; font-size: 18px; }

        /* CONTAINER */
        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }

        .recipe-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* BẢNG ẢNH BÌA MON AN */
        .recipe-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .recipe-content { padding: 25px; }

        .recipe-title {
            font-size: 26px;
            color: #222;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* METADATA BADGES */
        .meta-badges {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff3e0;
            color: #e65100;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* SECTION NGUYÊN LIỆU */
        .section { margin-bottom: 30px; }
        .section-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 8px;
        }
        .section-title i { color: #ff5722; }

        .ingredients-list {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px 20px;
            white-space: pre-line;
            font-size: 15px;
            color: #444;
        }

        /* SECTION CÁC BƯỚC NẤU */
        .steps-content {
            white-space: pre-line;
            font-size: 15px;
            color: #333;
            line-height: 1.8;
            background: #ffffff;
            padding: 10px 5px;
        }

        /* FOOTER BACK BUTTON */
        .footer-action { text-align: center; margin-top: 30px; margin-bottom: 40px; }
        .btn-home {
            display: inline-block;
            background: #ff5722;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,87,34,0.3);
            transition: background 0.2s;
        }
        .btn-home:hover { background: #e64a19; }

        @media (max-width: 600px) {
            .recipe-image { height: 230px; }
            .recipe-content { padding: 18px; }
            .recipe-title { font-size: 20px; }
            .container { margin: 15px auto; }
        }
    </style>
</head>
<body>

    <!-- HEADER NAVIGATION -->
    <header>
        <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Trang chủ</a>
        <a href="/" class="logo">Bếp Nhà Bông</a>
    </header>

    <div class="container">
        <div class="recipe-card">
            <!-- ẢNH MÓN ĂN -->
            <img src="{{ food.image }}" alt="{{ food.name }}" class="recipe-image">

            <div class="recipe-content">
                <!-- TÊN MÓN ĂN -->
                <h1 class="recipe-title">{{ food.name }}</h1>

                <!-- THÔNG TIN THỜI GIAN & KHẨU PHẦN -->
                <div class="meta-badges">
                    <span class="badge"><i class="fa-regular fa-clock"></i> {{ food.time }}</span>
                    <span class="badge"><i class="fa-solid fa-users"></i> {{ food.servings }}</span>
                </div>

                <!-- NGUYÊN LIỆU -->
                <div class="section">
                    <h2 class="section-title"><i class="fa-solid fa-basket-shopping"></i> Nguyên liệu chuẩn bị</h2>
                    <div class="ingredients-list">{{ food.ingredients }}</div>
                </div>

                <!-- CÁC BƯỚC NẤU -->
                <div class="section">
                    <h2 class="section-title"><i class="fa-solid fa-fire-burner"></i> Các bước dạy nấu ăn</h2>
                    <div class="steps-content">{{ food.steps }}</div>
                </div>
            </div>
        </div>

        <div class="footer-action">
            <a href="/" class="btn-home"><i class="fa-solid fa-house"></i> Xem thêm các món khác</a>
        </div>
    </div>

</body>
</html>
