<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - Bếp Nhà Bông</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: white; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        .logo-title { text-align: center; color: #e65100; font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #444; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .error-alert { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="auth-container">
    <a href="/" style="text-decoration: none;" class="logo-title">
        <i class="fa-solid fa-utensils"></i> Bếp Nhà Bông
    </a>

    <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Nhập Mã OTP & Đặt Mật Khẩu Mới</h3>

    {% if error %}
        <div class="error-alert"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form action="/reset-password" method="POST">
        <div class="form-group">
            <label>Mã OTP xác nhận</label>
            <input type="text" name="otp" placeholder="Nhập 6 số OTP..." required>
        </div>
        <div class="form-group">
            <label>Mật khẩu mới</label>
            <input type="password" name="password" placeholder="Mật khẩu tối thiểu 6 ký tự..." required minlength="6">
        </div>
        <div class="form-group">
            <label>Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới..." required minlength="6">
        </div>
        <button type="submit" class="btn-submit">Xác Nhận Đổi Mật Khẩu</button>
    </form>
</div>

</body>
</html>
