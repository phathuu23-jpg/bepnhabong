<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Deal Mới - Săn Sale 247</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #ff5722; }
        button[type="submit"] { background: #ff5722; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; transition: background 0.2s; }
        button[type="submit"]:hover { background: #e64a19; }
        .step-block { background: #fafafa; border: 1px dashed #ccc; padding: 12px; margin-bottom: 12px; border-radius: 8px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: #666; text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        .back-link:hover { color: #ff5722; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
    
    <h2 style="color: #ff5722; text-align: center; margin-bottom: 20px;"><i class="fa-solid fa-fire"></i> Đăng Deal Hời & Mã Giảm Giá</h2>
    
    {% if error %}
    <div style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px;">
        {{ error }}
    </div>
    {% endif %}

    <form action="/submit-recipe" method="POST" enctype="multipart/form-data">
        <!-- Token bảo mật CSRF nếu hệ thống yêu cầu -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>Tên sản phẩm / Deal hời *</label>
            <input type="text" name="name" required placeholder="Ví dụ: Tai nghe Bluetooth chống ồn giảm 50%">
        </div>

        <div class="form-group">
            <label>Danh mục / Sàn thương mại *</label>
            <select name="category" required>
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Mức giảm giá (Ví dụ: -50%, -100k)</label>
            <input type="text" name="time" placeholder="-50%">
        </div>

        <div class="form-group">
            <label>Trạng thái deal (Ví dụ: Flash Sale, Hot Deal)</label>
            <input type="text" name="servings" placeholder="Hot Deal">
        </div>

        <div class="form-group">
            <label>Ảnh đại diện sản phẩm *</label>
            <input type="file" name="image_file" accept="image/*" required>
        </div>

        <div class="form-group">
            <label>Thông tin chi tiết & Ưu đãi / Mã giảm giá *</label>
            <textarea name="ingredients" rows="4" required placeholder="Ghi rõ thông tin voucher, mã giảm giá, thời gian áp dụng..."></textarea>
        </div>

        <div class="form-group">
            <label style="color: #ff5722;">Các bước hướng dẫn săn deal nhanh (Kèm ảnh tùy chọn)</label>
            <div id="stepsContainer">
                <div class="step-block">
                    <b>Bước 1</b>
                    <textarea name="step_description[]" rows="2" style="margin: 5px 0;" required placeholder="Mô tả cách lấy mã hoặc áp mã..."></textarea>
                    <input type="file" name="step_image[]" accept="image/*">
                </div>
            </div>
            <button type="button" onclick="addStep()" style="background: #e0e0e0; color: #333; margin-top: 8px; padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">+ Thêm bước hướng dẫn</button>
        </div>

        <button type="submit">Đăng Deal Ngay</button>
    </form>
</div>

<script>
    let stepCount = 1;
    function addStep() {
        stepCount++;
        const container = document.getElementById('stepsContainer');
        const div = document.createElement('div');
        div.className = 'step-block';
        div.innerHTML = `<b>Bước ${stepCount}</b><textarea name="step_description[]" rows="2" style="margin: 5px 0;" required placeholder="Mô tả bước tiếp theo..."></textarea><input type="file" name="step_image[]" accept="image/*" style="margin-top:5px;">`;
        container.appendChild(div);
    }
</script>
</body>
</html>
