<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tư Vấn Dịch Vụ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-card { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { color: #003366; text-align: center; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d9534f; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #c9302c; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #003366; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>ĐĂNG KÝ TƯ VẤN TRỌN GÓI</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Họ và tên *</label>
                <input type="text" name="name" required placeholder="Ví dụ: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Số điện thoại *</label>
                <input type="tel" name="phone" required placeholder="Ví dụ: 0912345678">
            </div>
            <div class="form-group">
                <label>Địa chỉ Email *</label>
                <input type="email" name="email" required placeholder="nguyenvana@gmail.com">
            </div>
            <div class="form-group">
                <label>Dịch vụ cần tư vấn</label>
                <select name="service">
                    <option value="Đăng ký giấy phép kinh doanh">Đăng ký giấy phép kinh doanh</option>
                    <option value="Dịch vụ kế toán & Thuế">Dịch vụ kế toán & Thuế</option>
                    <option value="Tư vấn pháp lý doanh nghiệp">Tư vấn pháp lý doanh nghiệp</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ghi chú / Yêu cầu thêm</label>
                <textarea name="note" rows="3" placeholder="Chi tiết yêu cầu của bạn..."></textarea>
            </div>
            <button type="submit">GỬI ĐĂNG KÝ NGAY</button>
        </form>
        <a href="/" class="back-link">← Quay lại trang chủ</a>
    </div>
</body>
</html>s
