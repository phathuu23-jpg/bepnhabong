<div style="max-width:900px;margin:20px auto;font-family:sans-serif">
<h2>Admin - Up hàng ShopeeLate <a href="/flashsale">Xem flashsale</a> | <a href="/logout">Thoát</a></h2>
<h3>1. Paste Excel / hoặc chọn file .csv</h3>
<form method="post" action="/admin/import" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<textarea name="paste" style="width:100%;height:120px" placeholder="Tên[TAB]Giá gốc[TAB]Giá sale[TAB]Link[TAB]Ảnh[TAB]Đã bán"></textarea><br>
<input type="file" name="file" accept=".csv,.txt,.tsv">
<button>Up loạt</button>
</form>
<h3>2. Thêm lẻ 1 con</h3>
<form method="post" action="/admin/add">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input name="name" placeholder="Tên sp" required>
<input name="price" placeholder="Giá sale vd 99000">
<input name="old_price" placeholder="Giá gốc vd 199000">
<input name="aff_link" placeholder="Link Shopee">
<input name="image" placeholder="Link ảnh" style="width:300px">
<input name="sold" placeholder="1200">
<input name="category" placeholder="Công nghệ & Điện tử">
<button>Thêm</button>
</form>
<h3>Danh sách (200 mới nhất)</h3>
{% for f in foods %}
<div>{{f.id}} - {{f.name}} - {{f.price}} - <a href="{{f.aff_link}}" target="_blank">link</a>
<form method="post" action="/admin/delete/{{f.id}}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Xóa</button></form>
</div>
{% endfor %}
</div>
