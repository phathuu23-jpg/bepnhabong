<!-- KHU VỰC BÀI VIẾT CHỜ DUYỆT -->
<div class="card" style="border-left: 5px solid #ff9800;">
    <h3 style="color: #e65100;">⏳ Bài Viết Đang Chờ Duyệt ({{ pending_foods|length }})</h3>
    <table>
        <thead>
            <tr><th>Ảnh</th><th>Tên món</th><th>Người đăng</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
            {% for food in pending_foods %}
            <tr>
                <td><img src="{{ food.image }}" width="50" height="50" style="object-fit: cover; border-radius: 4px;"></td>
                <td>
                    <b>{{ food.name }}</b>
                    <br>
                    <a href="/detail/{{ food.id }}" target="_blank" style="font-size: 12px; color: #007bff;"><i class="fa-solid fa-eye"></i> Xem trước chi tiết</a>
                </td>
                <td>{{ food.author_name }}</td>
                <td>
                    <a href="/admin/approve/{{ food.id }}" class="btn-approve"><i class="fa-solid fa-check"></i> Duyệt Bài</a>
                    <a href="/delete/{{ food.id }}" class="btn-delete" onclick="return confirm('Từ chối và xóa bài này?')">Xóa</a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" style="text-align: center; color: #888;">Không có bài viết nào đang chờ duyệt.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
