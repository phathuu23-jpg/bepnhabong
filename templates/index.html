<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Săn Sale 247 - Deal Hot Shopee & Lazada Mỗi Ngày</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#f4f6f8;color:#222;padding-bottom:60px}
.header{background:linear-gradient(135deg, #ee4d2d, #ff7337);color:#fff;padding:14px 0;box-shadow:0 4px 12px rgba(238,77,45,0.2);position:sticky;top:0;z-index:100}
.header-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:22px;font-weight:900;color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo span{background:#fff;color:#ee4d2d;padding:2px 8px;border-radius:6px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;padding:7px 14px;border-radius:20px;font-weight:600;font-size:13px;background:rgba(255,255,255,0.16);transition:0.2s}
.nav a:hover, .nav a.active{background:#fff;color:#ee4d2d}

.admin-menu-btn{background:rgba(0,0,0,0.22);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;transition:0.2s}
.admin-menu-btn:hover{background:rgba(0,0,0,0.45)}

.container{max-width:1200px;margin:20px auto;padding:0 20px}

/* BANNER KHUYẾN MÃI */
.promo-banner{background:linear-gradient(135deg, #d70018, #ff6a00);border-radius:16px;padding:22px 25px;color:#fff;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(215,0,24,0.2);gap:15px}
.banner-content h2{font-size:24px;font-weight:900;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.banner-content p{font-size:14px;opacity:0.95;line-height:1.4}
.banner-badge{background:#ffe14d;color:#c80000;font-weight:900;padding:10px 18px;border-radius:14px;font-size:15px;text-align:center;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.15)}

/* TÌM KIẾM & DANH MỤC */
.search-box-wrap{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,0.04);margin-bottom:20px}
.search-form{display:flex;gap:10px}
.search-form input{flex:1;border:2px solid #ececec;border-radius:12px;padding:11px 16px;font-size:15px;outline:none;transition:0.2s}
.search-form input:focus{border-color:#ee4d2d}
.search-form button{background:#ee4d2d;color:#fff;border:none;padding:0 22px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;transition:0.2s}
.search-form button:hover{background:#d63e20}

.categories{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:4px}
.cat-item{color:#444;text-decoration:none;padding:7px 15px;background:#f5f6f8;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid #e6e8ec;transition:0.2s}
.cat-item.on, .cat-item:hover{background:#fff1f0;color:#ee4d2d;border-color:#ffa39e}

/* LƯỚI SẢN PHẨM */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:16px}
.product-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eaeaea;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.03);transition:0.2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.08);border-color:#ffd0c7}
.img-wrap{position:relative;height:185px;background:#fafafa;overflow:hidden;display:flex;align-items:center;justify-content:center}
.img-wrap img{width:100%;height:100%;object-fit:cover;transition:0.3s}
.product-card:hover .img-wrap img{transform:scale(1.03)}
.badge-discount{position:absolute;top:8px;right:8px;background:#ff2a2a;color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;box-shadow:0 2px 6px rgba(255,42,42,0.3)}
.badge-hot{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.65);color:#ffe14d;font-weight:700;font-size:10px;padding:3px 7px;border-radius:6px}

.card-body{padding:12px;display:flex;flex-direction:column;flex:1}
.product-title{font-size:13.5px;height:38px;overflow:hidden;line-height:1.4;color:#222;margin-bottom:8px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price-section{display:flex;align-items:baseline;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.current-price{color:#ee4d2d;font-weight:900;font-size:16.5px}
.original-price{color:#999;font-size:12px;text-decoration:line-through}

.meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
.sold-count{font-size:11px
