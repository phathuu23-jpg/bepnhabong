<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành công</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 60px 20px; background: #f4f6f9; }
        .box { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #28a745; margin-bottom: 15px; }
        p { color: #555; line-height: 1.6; margin-bottom: 20px; }
        a { display: inline-block; padding: 10px 20px; background: #003366; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Xác Nhận Thành Công!</h1>
        <p>Cảm ơn quý khách <strong>{{ name }}</strong> đã gửi thông tin đăng ký.</p>
        <p>Chuyên viên của SAO KIM sẽ liên hệ lại qua số điện thoại để tư vấn chi tiết cho bạn trong thời gian sớm nhất.</p>
        <a href="/">Trở về trang chủ</a>
    </div>
</body>
</html>
