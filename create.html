<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Công Thức Mới - Cookpad</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; padding: 40px; display: flex; justify-content: center; }
        .form-box { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e5e7eb; width: 100%; max-width: 600px; }
        h2 { color: #ff6b00; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #ff6b00; color: white; padding: 12px 24px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #e66000; }
        .back { display: block; margin-top: 15px; text-align: center; color: #6b7280; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Chia Sẻ Công Thức Nấu Ăn</h2>
        <form action="/create" method="POST">
            <div class="form-group">
                <label>Tên món ăn *</label>
                <input type="text" name="title" required placeholder="Ví dụ: Lẩu ếch măng cay">
            </div>
            <div class="form-group">
                <label>Tên người nấu (Tác giả)</label>
                <input type="text" name="author" placeholder="Ví dụ: Đầu bếp Minh">
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label>Thời gian nấu</label>
                    <input type="text" name="time" placeholder="Ví dụ: 45 phút">
                </div>
                <div style="flex:1;">
                    <label>Khẩu phần</label>
                    <input type="text" name="servings" placeholder="Ví dụ: 4 người">
                </div>
            </div>
            <div class="form-group">
                <label>Link hình ảnh món ăn (URL)</label>
                <input type="text" name="image_url" placeholder="Dán đường dẫn ảnh món ăn vào đây...">
            </div>
            <div class="form-group">
                <label>Nguyên liệu chuẩn bị *</label>
                <textarea name="ingredients" rows="3" required placeholder="Ví dụ: 500g thịt ếch, 200g măng chua, hành, tỏi, sa tế..."></textarea>
            </div>
            <div class="form-group">
                <label>Các bước thực hiện (Dạy nấu ăn) *</label>
                <textarea name="steps" rows="5" required placeholder="Bước 1: Sơ chế...&#10;Bước 2: Ướp gia vị...&#10;Bước 3: Nấu..."></textarea>
            </div>
            <button type="submit">ĐĂNG CÔNG THỨC</button>
        </form>
        <a href="/" class="back">← Hủy & Quay lại trang chủ</a>
    </div>
</body>
</html>
